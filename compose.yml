services:
  app:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: sigma_api

    ports:
      - "1199:1199"

    env_file:
      - .env

    depends_on:
      db:
        condition: service_healthy

    restart: unless-stopped

  db:
    image: postgres:18

    container_name: sigma_postgres

    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql
      - ./sqlProcessedVersion16-Final.sql:/docker-entrypoint-initdb.d/01-sigma.sql:ro

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10

    restart: unless-stopped

volumes:
  postgres_data:
